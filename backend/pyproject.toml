[project]
name = "krl-forecast-backend"
version = "0.1.0"
description = "FastAPI backend for KRL Jabodetabek passenger forecasting"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.14,<2.0",
  "redis>=5.2,<6.0",
  "httpx>=0.28,<1.0",
  "cachetools>=5.5,<6.0",
  "joblib>=1.4,<2.0",
  "pandas>=2.2,<3.0",
  "numpy>=2.0,<3.0",
  "structlog>=24.4,<26.0",
  "slowapi>=0.1.9,<1.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
ml = ["lightgbm>=4.5,<5.0", "statsmodels>=0.14,<1.0", "scikit-learn>=1.5,<2.0"]
dev = ["pytest>=8.3,<9.0", "pytest-asyncio>=0.24,<1.0", "ruff>=0.8,<1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
