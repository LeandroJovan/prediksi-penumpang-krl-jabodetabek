services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: krl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD di file .env (lihat .env.example)}
      POSTGRES_DB: krl_forecast
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krl -d krl_forecast"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.5.13
    volumes: [ollama:/root/.ollama]

  ollama-pull:
    image: ollama/ollama:0.5.13
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: qwen3.5:4b
    command: ["sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull qwen3.5:4b"]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # backend/.env.example hanya template; JANGAN dimuat sebagai konfigurasi (berisi secret placeholder).
    env_file:
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://krl:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/krl_forecast
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      ARTIFACTS_DIR: /app/artifacts/models
      # Kosong = endpoint admin nonaktif. Isi di .env (min 16 karakter, acak).
      KRL_API_KEY: ${KRL_API_KEY:-}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      ollama-pull: {condition: service_completed_successfully}
    ports: ["8000:8000"]
    volumes:
      - ./artifacts:/app/artifacts:ro

volumes:
  pgdata:
  redisdata:
  ollama:
